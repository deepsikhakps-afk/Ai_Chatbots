<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkChat — AI Chat Assistant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">InkChat</span>
      </div>

      <button id="newChatBtn" class="new-chat-btn">+ New conversation</button>

      <div class="history-label">Recent</div>
      <ul id="historyList" class="history-list"></ul>

      <div class="sidebar-footer">
        <label for="apiKeyInput">Anthropic API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
        <small>Stored only in your browser (localStorage).</small>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-area">
      <header class="chat-header">
        <h1 id="chatTitle">New conversation</h1>
        <select id="modelSelect">
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
        </select>
      </header>

      <section id="messages" class="messages">
        <div class="empty-state">
          <p class="empty-title">Start the conversation</p>
          <p class="empty-sub">Ask anything — your messages stay in this browser only.</p>
        </div>
      </section>

      <form id="chatForm" class="chat-input-bar">
        <textarea id="userInput" placeholder="Type a message..." rows="1" required></textarea>
        <button type="submit" id="sendBtn" aria-label="Send">➤</button>
      </form>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
